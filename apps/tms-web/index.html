<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>White Glove Therapy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=33" />
</head>
<body class="is-auth">
  <div class="app-backdrop" aria-hidden="true"></div>
  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="favicon.svg" width="40" height="40" alt="" />
      <div class="brand-copy">
        <h1>White Glove Therapy</h1>
        <p class="brand-tag">Clinical timesheets &amp; caseload ops</p>
      </div>
    </div>
    <div class="who" id="whoBar" hidden>
      <label id="rolePick" hidden>I am
        <select id="role">
          <option value="therapist">Therapist</option>
          <option value="admin">Admin</option>
        </select>
      </label>
      <span id="whoami"></span>
      <button type="button" class="btn" id="changePassword" hidden>Change password</button>
      <button type="button" class="btn" id="signout" hidden>Sign out</button>
    </div>
    <!-- Therapists use one page — keep this empty and always hidden -->
    <nav id="therapistNav" hidden></nav>
    <nav id="adminNav" class="admin-nav" hidden>
      <button type="button" data-admin="dash" class="nav on">Dashboard</button>
      <button type="button" data-admin="children" class="nav">Children</button>
      <button type="button" data-admin="providers" class="nav">Providers</button>
      <button type="button" data-admin="mandates" class="nav">Mandates</button>
      <button type="button" data-admin="schools" class="nav">Schools</button>
      <button type="button" data-admin="admins" class="nav">Admins</button>
      <button type="button" data-admin="reports" class="nav">Reports</button>
    </nav>
  </header>
  <main>
    <p id="status"></p>
    <div class="view-stage">
      <aside id="authAside" class="auth-aside" aria-hidden="true">
        <p class="auth-aside-kicker">White Glove Therapy</p>
        <p class="auth-aside-lead">Secure access for therapists and office staff.</p>
        <p class="auth-aside-sub">Track weeks, mandates, and signatures in one calm workspace.</p>
      </aside>
      <section id="view"></section>
    </div>
  </main>
  <footer id="siteFooter" class="site-footer">
    <a href="https://www.advancedautomations.net" target="_blank" rel="noopener noreferrer">Powered by Advanced Automations</a>
  </footer>
  <script src="config.js?v=33"></script>
  <script src="app.js?v=33"></script>
</body>
</html>

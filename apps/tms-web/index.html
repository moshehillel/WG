<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>White Glove Therapy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <header>
    <h1>White Glove Therapy</h1>
    <p class="lede" id="ledeText">One week at a time. Big buttons. If something is wrong, the page will say so in red.</p>
    <div class="who" id="whoBar" hidden>
      <label id="rolePick" hidden>I am
        <select id="role">
          <option value="therapist">Therapist</option>
          <option value="admin">Admin</option>
        </select>
      </label>
      <span id="whoami"></span>
      <button type="button" class="btn" id="changePassword" hidden>Change password</button>
      <button type="button" class="btn" id="signout" hidden>Sign out</button>
    </div>
    <!-- Therapists use one page — keep this empty and always hidden -->
    <nav id="therapistNav" hidden></nav>
    <nav id="adminNav" hidden>
      <button type="button" data-admin="dash" class="nav on">Dashboard</button>
      <button type="button" data-admin="people" class="nav">Provider</button>
      <button type="button" data-admin="mandates" class="nav">Mandates</button>
      <button type="button" data-admin="reports" class="nav">Reports</button>
    </nav>
  </header>
  <main>
    <p id="status"></p>
    <section id="view"></section>
  </main>
  <footer id="siteFooter"></footer>
  <script src="config.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
